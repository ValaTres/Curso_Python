<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Minha Página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #334155;
      text-align: center;
      padding: 70px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 25px #00000010;
    }

    h1 {
      color: #1e3a5f;
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      margin-bottom: 30px;
    }

    a {
      display: block;
      text-decoration: none;
      background: #e8f0fa;
      color: #24558a;
      padding: 14px;
      margin: 12px 0;
      border-radius: 8px;
      transition: .2s;
    }

    a:hover {
      background: #24558a;
      color: white;
      transform: translateY(-2px);
    }

    .email {
      background: #f1f5f9;
      color: #475569;
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Bem-vindo!</h1>
    <p>Acesse os recursos disponíveis abaixo.</p>
    <a href="/login"> Efetuar Login</a>
    <a href="/consultar_ibge/"> Consultar nomes e gráficos</a>
    <a class="email" href="mailto:lucas010123ls@gmail.com"> Entrar em contato</a>
    <footer>Desenvolvido com carinho por Lucas ♥</footer>
  </div>
</body>

</html>
